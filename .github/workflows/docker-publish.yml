name: Build and Publish Docker Images

# Multi-arch (amd64+arm64) image build via the shared container-build-multiarch
# reusable in githumps/infra-public. NATIVE per-arch builds — NO setup-qemu.
# PR = build-only validation; push main/tag = build + push manifest.

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        # tag pushes -> the version; everything else -> latest.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    uses: githumps/infra-public/.github/workflows/build.container-multiarch.yml@cd83e5727c0a7b904f780960664a51b3a3a0c685  # infra-public main; bump deliberately
    with:
      image: ghcr.io/${{ github.repository }}
      tag: ${{ needs.meta.outputs.tag }}
      context: .
      dockerfile: Dockerfile
      registry-type: ghcr
      push: ${{ github.event_name != 'pull_request' }}
